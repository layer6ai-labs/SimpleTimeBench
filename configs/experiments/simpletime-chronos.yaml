experiment_name: "simpletime_short_chronos2"

paths:
  storage_path: "data/simpletime/datasets" 
  output_path: "results"

forecaster:
  name: "MedianEnsemble"
  max_length: 512

  models:
    - name: "Chronos2"
      params:
        batch_size: 64
  alias: "SimpleTime-Chronos2" # An identifier for your ensemble
  
evaluation:
  to_univariate: false
  show_plot: false
  eval_substr: "dim0"

