    #   params:
    #     repo_id: "Salesforce/moirai-2.0-R-small" # "Salesforce/moirai-1.1-R-large"
    #     batch_size: 64
    # - name: "Sundial"
    #   params:
    #     batch_size: 64
    - name: "Chronos2"
      params:
        batch_size: 64
  alias: "Chronos2-Multivariate-Real"
  
evaluation:
  to_univariate: false
  show_plot: true
